services:
  db:
    image: mysql:8.0
    container_name: accesspc-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-accesspc}
      MYSQL_USER: ${MYSQL_USER:-accesspc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-accesspc2024}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: accesspc-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-accesspc}:${MYSQL_PASSWORD:-accesspc2024}@db:3306/${MYSQL_DATABASE:-accesspc}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      PORT: "5000"
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - media_data:/app/uploads
      - ${MEDIA_DIR:-./media}:/media:ro
    command: >
      sh -c "npx prisma db push && node server.js"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: accesspc-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mysql_data:
  media_data:
